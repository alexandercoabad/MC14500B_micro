
# Tiny Tapeout project information
project:
  title:        "MC14500B 1-bit Microcontroller (micro tile)"
  author:       "Alexander Co Abad"      # Your name
  discord:      "alexandercoabad_25756"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "MC14500B 1-bit CPU for teaching: 4 lab programs in ROM, debug view of PC/RR/IEN/OEN, steady 8-bit output, in a micro tile"
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:       50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies?
  tiles: "micro"          # micro: a quarter-size experimental tile (clk, rst_n, ui_in, uo_out only)

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_mc14500b_micro"
  
  # List your project's source files here. Source files must be in ./src and you must list each source file separately, one per line:
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "in0 (read at address 4)"
  ui[1]: "in1 (5)"
  ui[2]: "in2 (6)"
  ui[3]: "in3 (7)"
  ui[4]: "in4 (8) / DEBUG VIEW: 1 = uo_out shows PC, RR, IEN, OEN, skip"
  ui[5]: "in5 (9)"
  ui[6]: "in6 (A) / PROGRAM SELECT bit 0"
  ui[7]: "in7 (B) / PROGRAM SELECT bit 1: 00 echo, 01 gates, 10 IEN/OEN, 11 skip mux"

  # Outputs
  uo[0]: "OUT0 (published once per loop; debug view: skip)"
  uo[1]: "OUT1 (published once per loop; debug view: OEN)"
  uo[2]: "OUT2 (published once per loop; debug view: IEN)"
  uo[3]: "OUT3 (published once per loop; debug view: RR)"
  uo[4]: "OUT4 (published once per loop; debug view: PC0)"
  uo[5]: "OUT5 (published once per loop; debug view: PC1)"
  uo[6]: "OUT6 (published once per loop; debug view: PC2)"
  uo[7]: "OUT7 (published once per loop; debug view: PC3)"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
